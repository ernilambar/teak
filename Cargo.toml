[package]
name = "tinytext"
version = "0.1.10"
edition = "2024"
authors = ["Nilambar Sharma <nilambar@outlook.com>"]
license = "MIT"
homepage = "https://nilambar.net/"
repository = "https://github.com/ernilambar/tinytext"

# Declared so the package is its own workspace root and dependency features
# unify across dependency kinds. That is what lets the overlay UI tests turn on
# gpui-kit's `test-support` from a dev-dependency without shipping the harness
# (and its proptest tree) inside the app.
[workspace]
resolver = "2"

[dependencies]
anyhow = "1.0.104"
async-channel = "2"
gpui-kit = { version = "0.7.3", features = [
    "tree-sitter",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
] }
ropey = "1.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The overlay UI tests render the real app in gpui-kit's headless window.
[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }

# Produces the shareable macOS app bundle via `cargo bundle --release`
# (or ./scripts/bundle.sh). Regenerate the icon with scripts/make-icon.py.
[package.metadata.bundle]
name = "Tinytext"
identifier = "net.nilambar.tinytext"
icon = ["assets/icon.icns"]
category = "public.app-category.developer-tools"
short_description = "A native macOS text editor built with GPUI Kit"
copyright = "Copyright © 2026 Nilambar Sharma"
osx = { minimum_system_version = "15.0", info_plist_exts = ["assets/Info.plist"] }

# Keep GPUI's framework crates optimized in debug builds; without this the app
# renders and responds far below the release build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# Vendored gpui-base with patches/gpui-base.patch applied (multi-selection API).
# Re-vendor with ./scripts/vendor-gpui-base.sh <version> after bumping gpui-kit.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
