[package]
name = "teak"
version = "0.2.4"
edition = "2024"
rust-version = "1.99"
authors = ["Nilambar Sharma <nilambar@outlook.com>"]
license = "MIT"
homepage = "https://nilambar.net/"
repository = "https://github.com/ernilambar/teak"

# Declared so the package is its own workspace root and dependency features
# unify across dependency kinds. That is what lets the overlay UI tests turn on
# gpui-kit's `test-support` from a dev-dependency without shipping the harness
# (and its proptest tree) inside the app.
[workspace]
resolver = "2"

[dependencies]
async-channel = "2"
gpui-kit = { version = "0.8.1", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# `globset` and `ignore` are already in the tree; used directly for the
# Quick Open / Find in Files walk (`.gitignore` and `search.exclude`).
globset = "0.4.20"
ignore = "0.4.33"
# Printing goes through AppKit's NSTextView + NSPrintOperation; GPUI has no
# print API. The feature list is the smallest set those two need.
# `dispatch2` defers the print panel to the main queue, off the GPUI update that
# asked for it; it comes from the same family and is already in the tree.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSFont",
    "NSPrintInfo",
    "NSPrintOperation",
    "NSResponder",
    "NSText",
    "NSTextView",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSString",
] }
regex = "1.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Moves deleted files to the Trash.
trash = "5.2"
ureq = "3.5.0"

# The overlay UI tests render the real app in gpui-kit's headless window.
[dev-dependencies]
gpui-kit = { version = "0.8.1", features = ["test-support"] }

# Produces the shareable macOS app bundle via `cargo bundle --release`
# (or ./scripts/bundle.sh). Regenerate the icon with scripts/make-icon.py.
[package.metadata.bundle]
name = "Teak"
identifier = "net.nilambar.teak"
icon = ["assets/icon.icns"]
category = "public.app-category.developer-tools"
short_description = "A fast, lightweight text editor"
copyright = "Copyright © 2026 Nilambar Sharma"
osx = { minimum_system_version = "15.0", info_plist_exts = ["assets/Info.plist"] }

# Keep GPUI's framework crates optimized in debug builds; without this the app
# renders and responds far below the release build.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# Vendored gpui-base with patches/gpui-base.patch applied (multi-selection API).
# Re-vendor with ./scripts/vendor-gpui-base.sh <version> after bumping gpui-kit.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
