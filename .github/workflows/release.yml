name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild the assets of an existing release without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload the rebuilt assets to
        required: true
        type: string
      ref:
        description: Git revision to build (defaults to the branch you run this from)
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

  build:
    name: Build (macOS arm64)
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Build macOS bundle
        run: |
          cargo build --release --locked
          cargo bundle --release
          codesign --force --deep --sign - target/release/bundle/osx/Teak.app
          ditto -c -k --keepParent target/release/bundle/osx/Teak.app "Teak-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Teak-macos-arm64.zip
          path: Teak-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
