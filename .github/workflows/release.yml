name: Release

on:
  push:
    tags: ["v*"]
  # Rebuild the assets of an existing release without cutting a new tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload the rebuilt assets to
        required: true
        type: string
      ref:
        description: Git revision to build (defaults to the branch you run this from)
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            asset: Teak-macos-arm64.zip
          - name: Linux x86_64
            os: ubuntu-latest
            asset: Teak-linux-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            asset: Teak-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-render0-dev \
            libxcb-res0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - uses: taiki-e/install-action@v2
        if: runner.os == 'macOS'
        with:
          tool: cargo-bundle

      - name: Build macOS bundle
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked
          cargo bundle --release
          codesign --force --deep --sign - target/release/bundle/osx/Teak.app
          ditto -c -k --keepParent target/release/bundle/osx/Teak.app "${{ matrix.asset }}"

      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          strip target/release/teak
          tar -czf "${{ matrix.asset }}" -C target/release teak

      - name: Build Windows binary
        if: runner.os == 'Windows'
        run: cargo build --release --locked

      - name: Verify Windows static C runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found; cannot locate dumpbin."
          }

          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe not found; cannot verify the C runtime linkage."
          }

          $dependents = & $dumpbin /nologo /dependents target/release/teak.exe
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE."
          }
          $dependents

          $dynamicCrt = $dependents | Select-String -Pattern 'vcruntime140|msvcp140'
          if ($dynamicCrt) {
            throw "teak.exe still imports the dynamic C runtime: $dynamicCrt"
          }

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/teak.exe -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
